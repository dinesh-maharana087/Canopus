[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "device-watch-agent"
version = "0.1.0"
description = "Native Device Watch agent foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
device-watch-agent = "device_watch_agent.main:main"

[dependency-groups]
test = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/device_watch_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
